          "run": "export GITHUB_REF_NAME='v2.0.0'\nexport GITHUB_REF_TYPE=tag\npython -m build"
        },
        {
          "name": "Verify built identities and write exact checksums",
          "run": "export GITHUB_REF_NAME='v2.0.0'\nexport GITHUB_REF_TYPE=tag\npython - <<'PY'\nimport hashlib, os, re, tarfile, tomllib, zipfile\nfrom email.parser import BytesParser\nfrom pathlib import Path\nproject = tomllib.loads(Path(\"pyproject.toml\").read_text())[\"project\"]\nversion = project[\"version\"]\nassert os.environ[\"GITHUB_REF_NAME\"] == \"v\" + version\nstem = re.sub(r\"[-_.]+\", \"_\", project[\"name\"])\nwheel = Path(\"dist\") / (stem + \"-\" + version + \"-py3-none-any.whl\")\nsdist = Path(\"dist\") / (stem + \"-\" + version + \".tar.gz\")\nassert set(Path(\"dist\").iterdir()) == {wheel, sdist}\nwith zipfile.ZipFile(wheel) as package:\n    metadata = [name for name in package.namelist() if name.endswith(\".dist-info/METADATA\")]\n    assert len(metadata) == 1\n    wheel_info = BytesParser().parsebytes(package.read(metadata[0]))\nwith tarfile.open(sdist) as package:\n    member = package.extractfile(stem + \"-\" + version + \"/PKG-INFO\")\n    assert member is not None\n    sdist_info = BytesParser().parsebytes(member.read())\nfor info in [wheel_info, sdist_info]:\n    assert info[\"Name\"] == project[\"name\"] and info[\"Version\"] == version\n    assert info[\"Requires-Python\"] == project[\"requires-python\"]\npayloads = sorted([wheel, sdist])\nPath(\"dist/SHA256SUMS\").write_text(\"\".join(hashlib.sha256(path.read_bytes()).hexdigest() + \"  \" + path.name + \"\\n\" for path in payloads))\nPY\n"
        },
        {
          "name": "Fingerprint source-only build payloads",
          "run": "python - <<'PY_EXPECT'\nimport pathlib,hashlib,json\ndist=pathlib.Path('dist')\nfiles=sorted(p for p in dist.rglob('*') if p.is_file())\nassert files and sum(p.stat().st_size for p in files)<64*1024*1024\nassert all(not p.is_symlink() for p in files)\nexpected={p.relative_to(dist).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files}\npathlib.Path('.fixture-expected.json').write_text(json.dumps(expected,sort_keys=True))\nprint(json.dumps(expected,sort_keys=True))\nPY_EXPECT"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "fixture-cbz-page-auditor-release-artifacts",
            "path": "dist/*",
            "if-no-files-found": "error",
            "retention-days": 1
          },
          "id": "upload",
          "name": "Exercise actions/upload-artifact at reviewed commit"
        },
        {
          "name": "Download this run\u2019s temporary artifact",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "fixture-cbz-page-auditor-release-artifacts",
            "path": ".fixture-downloaded"
          }
        },

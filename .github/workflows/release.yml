      "env": {
        "EXPECTED_TREE": "${{ matrix.tree }}",
        "SOURCE_HEAD": "${{ matrix.head }}",
        "RUNTIME_GROUP": "${{ matrix.runtimeGroup }}",
        "PATCH_FILE": "${{ matrix.patchFile }}",
        "PATCH_SHA": "${{ matrix.patchSha256 }}",
        "PHP_POLICY": "${{ matrix.policy }}",
        "SOURCE_SLUG": "${{ matrix.slug }}"
      },
      "defaults": {
        "run": {
          "shell": "bash",
          "working-directory": "source"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "loganpendragonmultiverse/blink",
            "ref": "${{ github.sha }}",
            "path": "controller",
            "persist-credentials": false
          }
        },
        {
          "name": "Assert nonpublishing fixture branch",
          "working-directory": "controller",
          "run": "test \"$GITHUB_REF\" = refs/heads/audit/nonpublishing-action-fixtures-20261102\ntest \"$GITHUB_EVENT_NAME\" = workflow_dispatch"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "${{ matrix.repository }}",
            "ref": "${{ matrix.head }}",
            "path": "source",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "3.12"
          }
        },
        {
          "uses": "shivammathur/setup-php@eb7c497e18156a6bbabfef1d3a82760b9eda3962",
          "with": {
            "php-version": "${{ matrix.php }}",
            "extensions": "pdo_sqlite, mbstring, iconv, curl, dom, xml, fileinfo, gd",
            "coverage": "none"
          }
        },
        {
          "uses": "actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020",
          "with": {
            "node-version": "22"
          }
        },
        {
          "name": "Materialize and verify private integration tree",
          "run": "python - <<'PY_TREE'\nimport pathlib,hashlib,subprocess,os,json\np=pathlib.Path('../controller/.integration-fixtures')/os.environ['PATCH_FILE']\nassert hashlib.sha256(p.read_bytes()).hexdigest()==os.environ['PATCH_SHA']\nsubprocess.run(['git','config','core.autocrlf','false'],check=True)\nsubprocess.run(['git','apply','--cached','--check',str(p)],check=True)\nsubprocess.run(['git','apply','--cached',str(p)],check=True)\nactual=subprocess.check_output(['git','write-tree'],text=True).strip();assert actual==os.environ['EXPECTED_TREE'],actual\nsubprocess.run(['git','checkout-index','--all','--force'],check=True)\nc=json.loads(pathlib.Path('composer.json').read_text());assert {'php':c['require']['php'],'platform':c.get('config',{}).get('platform')}==json.loads(os.environ['PHP_POLICY'])\nprint('Verified exact private integration tree and unchanged PHP policy',actual)\nPY_TREE"
        },
        {
          "name": "Run synthetic supported-runtime integration gates",
          "env": {
            "EVIDENCE_PATH": "${{ runner.temp }}/php-integration.json"
          },
          "run": "python - <<'PY_GATES'\nimport os,subprocess,pathlib,json,shutil\nfor n in ['storage/app/private','storage/app/public','storage/framework/cache/data','storage/framework/sessions','storage/framework/views','storage/logs','bootstrap/cache']:pathlib.Path(n).mkdir(parents=True,exist_ok=True)\nshutil.copyfile('.env.example','.env')\nif os.environ['SOURCE_SLUG']=='marketing-bidding-central':\n commands=[('composer-install','composer install --no-interaction --prefer-dist --no-progress'),('validate','composer validate --strict --no-check-version'),('lint','php vendor/bin/pint --test'),('full-php-tests','php artisan test --no-ansi'),('dependency-audit','composer audit --locked'),('source-readiness','python scripts/audit-release.py'),('source-package','python scripts/package-release.py')]\nelse:commands=[('fresh-install','php install.php'),('full-php-tests','php artisan test --no-ansi'),('composer-audit','composer audit --locked'),('npm-audit','npm audit')]\nresults=[]\nfor name,cmd in commands:\n p=subprocess.run(cmd,shell=True,capture_output=True,text=True,encoding='utf-8',errors='replace');print('GATE',name,'EXIT',p.returncode,flush=True);print(p.stdout,flush=True);print(p.stderr,flush=True);results.append({'gate':name,'exit':p.returncode,'tail':(p.stdout+p.stderr)[-7000:]})\n if name in ['composer-install','fresh-install'] and p.returncode:break\npayload={'tree':os.environ['EXPECTED_TREE'],'source_head':os.environ['SOURCE_HEAD'],'runtime_group':os.environ['RUNTIME_GROUP'],'php':subprocess.check_output('php --version',shell=True,text=True).splitlines()[0],'results':results,'all_passed':len(results)==len(commands) and all(x['exit']==0 for x in results)}\npathlib.Path(os.environ['EVIDENCE_PATH']).write_text(json.dumps(payload,indent=2));assert payload['all_passed'],json.dumps(payload)\nPY_GATES"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "if": "always()",
          "with": {
            "name": "${{ matrix.caseKey }}",
            "path": "${{ runner.temp }}/php-integration.json",
            "if-no-files-found": "error",
            "retention-days": 1
          }
        }

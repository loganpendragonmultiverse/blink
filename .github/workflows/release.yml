    "runtime_0": {
      "runs-on": "windows-latest",
      "timeout-minutes": 20,
      "strategy": {
        "fail-fast": false,
        "matrix": {
          "python": [
            "3.11",
            "3.14"
          ]
        }
      },
      "env": {
        "EXPECTED_TREE": "05356dc06cb68ad6a7f54c7b3c91d43cbf1b9fac",
        "SOURCE_HEAD": "16af11189e7c19851ab5c7a792db0bd5c87c2f9d",
        "RUNTIME_GROUP": "cbecd84b6e3a98558fa6741ce900d45eb3dd859a3046449cfb868dae9e364319",
        "EVIDENCE_PATH": "${{ runner.temp }}/forge-pdf-integration.json",
        "PIP_PROGRESS_BAR": "off"
      },
      "defaults": {
        "run": {
          "shell": "bash",
          "working-directory": "source"
        }
      },
      "steps": [
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "loganpendragonmultiverse/blink",
            "ref": "${{ github.sha }}",
            "path": "controller",
            "persist-credentials": false
          }
        },
        {
          "name": "Assert nonpublishing fixture branch",
          "working-directory": "controller",
          "run": "test \"$GITHUB_REF\" = refs/heads/audit/nonpublishing-action-fixtures-20261102\ntest \"$GITHUB_EVENT_NAME\" = workflow_dispatch"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "loganpendragonmultiverse/forge-pdf",
            "ref": "16af11189e7c19851ab5c7a792db0bd5c87c2f9d",
            "path": "source",
            "persist-credentials": false
          }
        },
        {
          "uses": "actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97",
          "with": {
            "python-version": "${{ matrix.python }}"
          }
        },
        {
          "name": "Materialize and verify private integration tree",
          "run": "python - <<'PY_TREE'\nimport pathlib,hashlib,subprocess,os,tomllib\np=pathlib.Path('../controller/.integration-fixtures/forge-pdf-cbecd84b6e3a.patch')\nassert hashlib.sha256(p.read_bytes()).hexdigest()=='32bc6703018f9a667bba3881632bab5564f3ec4a808786b2c206c11946ae9bcb'\nsubprocess.run(['git','config','core.autocrlf','false'],check=True)\nsubprocess.run(['git','apply','--cached','--check',str(p)],check=True)\nsubprocess.run(['git','apply','--cached',str(p)],check=True)\nactual=subprocess.check_output(['git','write-tree'],text=True).strip();assert actual==os.environ['EXPECTED_TREE'],actual\nsubprocess.run(['git','checkout-index','--all','--force'],check=True)\nassert tomllib.loads(pathlib.Path('pyproject.toml').read_text())['project']['requires-python']=='>=3.11'\nassert 'pypdf==6.21.4' in pathlib.Path('requirements-lock.txt').read_text()\nprint('Verified exact private integration tree',actual)\nPY_TREE"
        },
        {
          "name": "Run original Windows quality and dependency gates",
          "run": "python - <<'PY_GATES'\nimport subprocess,json,pathlib,os,hashlib\ncommands=[\n('install',['python','-m','pip','install','-r','requirements-lock.txt','-e','.[dev]']),\n('full-windows-pytest',['python','-m','pytest','-q']),\n('lint',['python','-m','ruff','check','.']),\n('format',['python','-m','ruff','format','--check','.']),\n('build',['python','-m','build']),\n('dependency-audit',['python','-m','pip_audit','-r','requirements-lock.txt'])]\nresults=[]\nfor name,args in commands:\n p=subprocess.run(args,capture_output=True,text=True)\n print('GATE',name,'EXIT',p.returncode,flush=True)\n print(p.stdout,flush=True);print(p.stderr,flush=True)\n results.append({'gate':name,'exit':p.returncode,'tail':(p.stdout+p.stderr)[-8000:]})\n if name=='install' and p.returncode:break\npayload={'tree':os.environ['EXPECTED_TREE'],'source_head':os.environ['SOURCE_HEAD'],'runtime_group':os.environ['RUNTIME_GROUP'],'python':subprocess.check_output(['python','--version'],text=True).strip(),'results':results,'all_passed':len(results)==6 and all(x['exit']==0 for x in results)}\npathlib.Path(os.environ['EVIDENCE_PATH']).write_text(json.dumps(payload,indent=2))\nassert payload['all_passed'],json.dumps(payload)\nPY_GATES"
        },
        {
          "uses": "actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a",
          "if": "always()",
          "with": {
            "name": "pdf-integration-cbecd84b6e3a-${{ matrix.python }}",
            "path": "${{ env.EVIDENCE_PATH }}",
            "if-no-files-found": "error",
            "retention-days": 1
          }
        }
      ]
    },

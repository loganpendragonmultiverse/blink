{
  "name": "Nonpublishing maintenance action fixtures",
  "on": {
    "workflow_dispatch": {}
  },
  "permissions": {
    "contents": "read"
  },
  "jobs": {
    "ai_placeholder_detector": {
      "runs-on": "ubuntu-latest",
      "steps": [
        {
          "name": "Assert fixture-only event and branch",
          "run": "test \"$GITHUB_EVENT_NAME\" = workflow_dispatch\ntest \"$GITHUB_REF\" = refs/heads/audit/nonpublishing-action-fixtures-20261102"
        },
        {
          "uses": "actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1",
          "with": {
            "repository": "loganpendragonmultiverse/ai-placeholder-detector",
            "ref": "87ab786c1473ec9f2da24e3b9586f0ee2e503aa2",
            "persist-credentials": false
          }
        },
        {
          "name": "Verify exact candidate checkout",
          "run": "test \"$(git rev-parse HEAD)\" = 87ab786c1473ec9f2da24e3b9586f0ee2e503aa2"
        },
        {
          "uses": "actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0",
          "with": {
            "python-version": "3.14"
          },
          "name": "Exercise actions/setup-python at reviewed commit"
        },
        {
          "run": "export GITHUB_REF_NAME='v1.2.0'\nexport GITHUB_REF_TYPE=tag\npython -m pip install . pytest build"
        },
        {
          "run": "export GITHUB_REF_NAME='v1.2.0'\nexport GITHUB_REF_TYPE=tag\npython -m pytest"
        },
        {
          "run": "export GITHUB_REF_NAME='v1.2.0'\nexport GITHUB_REF_TYPE=tag\npython -m build"
        },
        {
          "name": "Fingerprint source-only build payloads",
          "run": "python - <<'PY_EXPECT'\nimport pathlib,hashlib,json\ndist=pathlib.Path('dist')\nfiles=sorted(p for p in dist.rglob('*') if p.is_file())\nassert files and sum(p.stat().st_size for p in files)<64*1024*1024\nassert all(not p.is_symlink() for p in files)\nexpected={p.relative_to(dist).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in files}\npathlib.Path('.fixture-expected.json').write_text(json.dumps(expected,sort_keys=True))\nprint(json.dumps(expected,sort_keys=True))\nPY_EXPECT"
        },
        {
          "uses": "actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9",
          "with": {
            "name": "fixture-ai-placeholder-detector-release-artifacts",
            "path": "dist/*.whl\ndist/*.tar.gz\n",
            "if-no-files-found": "error",
            "retention-days": 1
          },
          "id": "upload",
          "name": "Exercise actions/upload-artifact at reviewed commit"
        },
        {
          "name": "Download this run\u2019s temporary artifact",
          "uses": "actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333",
          "with": {
            "name": "fixture-ai-placeholder-detector-release-artifacts",
            "path": ".fixture-downloaded"
          }
        },
        {
          "name": "Verify downloaded payload bytes",
          "run": "python - <<'PY_VERIFY'\nimport pathlib,hashlib,json,os\nexpected=json.loads(pathlib.Path('.fixture-expected.json').read_text())\nroot=pathlib.Path('.fixture-downloaded')\nactual={p.relative_to(root).as_posix():hashlib.sha256(p.read_bytes()).hexdigest() for p in root.rglob('*') if p.is_file()}\nassert actual==expected,(actual,expected)\nprint(json.dumps({'passed':True,'files':actual,'artifact_id':os.environ['ARTIFACT_ID'],'artifact_digest':os.environ['ARTIFACT_DIGEST']},sort_keys=True))\nPY_VERIFY",
          "env": {
            "ARTIFACT_ID": "${{ steps.upload.outputs.artifact-id }}",
            "ARTIFACT_DIGEST": "${{ steps.upload.outputs.artifact-digest }}"
          }
        }
      ],
      "timeout-minutes": 25,
      "permissions": {
        "contents": "read"
      }
    },
